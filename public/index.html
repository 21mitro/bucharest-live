<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="București Live">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0c0e12">
<meta name="color-scheme" content="dark">
<title>București Live</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#0c0e12;
  --surface:#151824;
  --surface-border:rgba(255,255,255,.15);
  --ink:#f2f4f8;
  --muted:rgba(242,244,248,.65);
  --line:rgba(255,255,255,.14);
  --line-strong:rgba(255,255,255,.24);
  --tram:#ff4d6d;
  --trolleybus:#1fb97a;
  --bus:#4c8dff;
  --night:#8b6cff;
  --metro:#f0c14a;
  --other:#8b97a8;
  --ms:1;
}
*{box-sizing:border-box}
html{
  background-color:var(--bg)!important;
  width:100%;
  height:100%;
}
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  min-height:100%;
  min-height:-webkit-fill-available;
  min-height:calc(100% + env(safe-area-inset-top, 0px));
  overflow:hidden;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background-color:var(--bg)!important;
  font-family:Outfit,system-ui,-apple-system,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

/* ─── FULL-SCREEN MAP (Extends edge-to-edge without chin gap) ─── */
#map{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  width:100%;
  height:100%;
  min-height:100%;
  min-height:-webkit-fill-available;
  background-color:#10141c!important;
  z-index:0;
}
.maplibregl-map, .maplibregl-canvas-container, .maplibregl-canvas {
  background-color:#10141c!important;
  width:100%!important;
  height:100%!important;
}

button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--bus);outline-offset:2px}

/* ─── CRISP TOP BAR (NO BLUR OVERLAY ON SEARCH) ─── */
#top {
  position:fixed;
  z-index:5;
  isolation:isolate;
  left:max(12px, env(safe-area-inset-left));
  right:calc(max(10px, env(safe-area-inset-right)) + 48px);
  top:max(10px, env(safe-area-inset-top));
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
}
#top > * { pointer-events:auto }
@media (min-width: 640px) {
  #top {
    left:50%;
    transform:translateX(-50%);
    width:min(480px, calc(100% - 24px));
    right:auto;
  }
}
#finder { position:relative; z-index:5; width:100% }

/* Search bar is crisp, solid, with NO blur or glare */
#search {
  display:flex;
  align-items:center;
  gap:10px;
  height:48px;
  padding:0 14px;
  border-radius:16px;
  background:var(--surface);
  border:1px solid var(--surface-border);
  box-shadow:0 6px 20px rgba(0,0,0,.5);
}
#search svg { flex:none; opacity:.8; color:var(--ink) }
#search input {
  flex:1;
  min-width:0;
  background:none;
  border:0;
  font-size:16px; /* 16px is required to prevent iOS Safari auto-zoom */
  font-weight:500;
  color:#fff;
  -webkit-appearance:none;
  border-radius:0;
}
#search input::placeholder { color:var(--muted); opacity:1 }
#searchClear {
  display:none;
  width:24px;
  height:24px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:var(--muted);
  flex-shrink:0;
}
#searchClear:hover { background:rgba(255,255,255,.2); color:#fff }

#suggest {
  position:absolute;
  left:0; right:0;
  top:calc(100% + 6px);
  display:none;
  flex-direction:column;
  padding:6px;
  border-radius:16px;
  background:#141724;
  border:1px solid var(--surface-border);
  box-shadow:0 12px 32px rgba(0,0,0,.65);
  max-height:260px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#suggest button {
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  border:0;
  border-radius:12px;
  padding:8px 10px;
  text-align:left;
  transition:background .15s;
}
#suggest button:hover, #suggest button[aria-selected=true] { background:rgba(255,255,255,.08) }
#suggest b {
  min-width:46px;
  height:26px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
  font-weight:700;
  box-shadow:0 2px 6px rgba(0,0,0,.35);
}
#suggest span {
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#chips {
  position:relative;
  z-index:1;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chip {
  flex:none;
  height:34px;
  border-radius:17px;
  padding:0 12px;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  font-weight:600;
  background:var(--surface);
  border:1px solid var(--surface-border);
  box-shadow:0 3px 10px rgba(0,0,0,.35);
  transition:opacity .2s, transform .15s;
}
.chip:active { transform:scale(0.97) }
.chip i { width:8px; height:8px; border-radius:50% }
.chip em { font-style:normal; color:var(--muted); font-weight:600; margin-left:2px }
.chip[aria-pressed=false] { opacity:.42 }

#status {
  align-self:flex-start;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  padding:4px 11px;
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--surface-border);
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.live-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:#10b981;
  box-shadow:0 0 8px #10b981;
  animation:pulseDot 1.6s infinite;
}

/* ─── LIQUID GLASS BOTTOM CONTAINER & COMPONENTS ─── */
.liquid-glass {
  background: linear-gradient(145deg, rgba(20, 25, 36, 0.91) 0%, rgba(13, 16, 24, 0.94) 100%);
  backdrop-filter: blur(28px) saturate(190%) contrast(106%);
  -webkit-backdrop-filter: blur(28px) saturate(190%) contrast(106%);
  border: 1px solid var(--line);
  box-shadow: 
    0 18px 45px -8px rgba(0, 0, 0, 0.72),
    0 4px 14px rgba(0, 0, 0, 0.45),
    inset 0 1px 1px 0 rgba(255, 255, 255, 0.32),
    inset 0 -1px 1px 0 rgba(0, 0, 0, 0.5);
  position: relative;
}
.liquid-glass::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 42%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
  border-radius: inherit;
}

#bottom {
  position:fixed;
  z-index:10;
  left:50%;
  transform:translateX(-50%);
  width:min(480px, calc(100% - 24px));
  bottom:max(12px, env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
}
#bottom > * { pointer-events:auto }

/* ─── SHEET PANEL (Vehicles & Lines) ─── */
#sheet {
  max-height:min(58vh, 480px);
  display:none;
  flex-direction:column;
  border-radius:20px;
  padding:12px 14px;
  animation:sheetPop 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes sheetPop {
  from { opacity:0; transform:translateY(10px) scale(0.985); }
  to { opacity:1; transform:translateY(0) scale(1); }
}
.sheet-top {
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:6px;
  flex-shrink:0;
}
.sheet-header-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 2px;
}
.sheet-title {
  font-size:15px;
  font-weight:700;
  letter-spacing:-0.01em;
  color:#fff;
  display:flex;
  align-items:center;
  gap:6px;
}
#sheetClose {
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  transition:all .15s;
}
#sheetClose:hover { background:rgba(255,255,255,.14); color:#fff }
#tabs {
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
#tabs button {
  flex:none;
  border-radius:12px;
  height:32px;
  padding:0 12px;
  background:rgba(255,255,255,.06);
  border:1px solid transparent;
  font-weight:600;
  font-size:13px;
  color:var(--muted);
  transition:all .16s;
}
#tabs button:hover { background:rgba(255,255,255,.1); color:#fff }
#tabs button[aria-selected=true] {
  color:#fff;
  border-color:rgba(255,255,255,.2);
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
#list {
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:3px;
  padding-right:2px;
  flex:1;
  min-height:120px;
  -webkit-overflow-scrolling:touch;
}
.ln {
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  height:46px;
  border-radius:12px;
  background:transparent;
  padding:0 8px;
  text-align:left;
  border:1px solid transparent;
  transition:background .15s, border-color .15s;
}
.ln:hover, .ln.active {
  background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.1);
}
.ln b {
  min-width:52px;
  height:28px;
  padding:0 8px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:14px;
  font-weight:700;
  letter-spacing:-.03em;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.ln span {
  flex:1;
  min-width:0;
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ln em {
  font-style:normal;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  min-width:18px;
  text-align:right;
}
.ln.off { opacity:.4 }
#sheetNote {
  font-size:11px;
  color:var(--muted);
  padding:6px 4px 2px;
  flex-shrink:0;
}

/* ─── REDESIGNED VEHICLE CARD ─── */
#card {
  display:none;
  border-radius:22px;
  padding:16px;
  flex-direction:column;
  gap:0;
  animation:cardIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  max-height:calc(100dvh - 200px);
  overflow-y:auto;
  overflow-x:hidden;
}
@keyframes cardIn {
  from { opacity:0; transform:translateY(10px); }
  to { opacity:1; transform:translateY(0); }
}

/* Row 1: Badge + Title + Close */
.card-header-row {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  margin-bottom:10px;
}
#cardBadge {
  min-width:52px;
  height:46px;
  padding:0 10px;
  border-radius:14px;
  color:#fff;
  font-weight:700;
  font-size:20px;
  letter-spacing:-.04em;
  display:flex;
  align-items:center;
  justify-content:center;
  font-variant-numeric:tabular-nums;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
  flex-shrink:0;
}
.card-details {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
#cardTitle {
  font-size:15px;
  font-weight:700;
  letter-spacing:-.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#fff;
  line-height:1.2;
}
#cardSub {
  font-size:12.5px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:2px;
  line-height:1.2;
}
#cardMeta { display:none }
#clear {
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  flex-shrink:0;
  transition:all .15s;
}
#clear:hover { background:rgba(255,255,255,.16); color:#fff }

/* Row 2: Vehicle details grid (only when focused) */
.card-info-grid {
  display:none;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  width:100%;
  margin-bottom:10px;
}
.card-info-grid.visible { display:grid }
.card-info-cell {
  padding:7px 8px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
}
.card-info-label {
  font-size:9.5px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:rgba(242,244,248,.45);
  line-height:1;
}
.card-info-value {
  font-size:12.5px;
  font-weight:700;
  color:#fff;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}

/* Row 3: Next stop highlight */
.card-next-stop {
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-radius:12px;
  background:rgba(76,141,255,.08);
  border:1px solid rgba(76,141,255,.18);
  margin-bottom:10px;
  width:100%;
}
.card-next-stop.visible { display:flex }
.card-ns-icon {
  flex-shrink:0;
  width:28px;
  height:28px;
  border-radius:8px;
  background:rgba(76,141,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#4c8dff;
}
.card-ns-text {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:1px;
}
.card-ns-label {
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.4px;
  color:rgba(242,244,248,.5);
  line-height:1;
}
.card-ns-name {
  font-size:13px;
  font-weight:700;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.2;
}
.card-ns-eta {
  flex-shrink:0;
  font-size:13px;
  font-weight:700;
  color:#1fb97a;
  white-space:nowrap;
}
.card-ns-eta.atStop {
  color:#ffb703;
}

/* Row 4: Status bar (live count or signal age) */
.card-status-bar {
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.card-status-bar .live-pulse {
  width:6px;
  height:6px;
  border-radius:50%;
  background:#1fb97a;
  display:inline-block;
  animation:pulseDot 1.5s infinite;
}

/* Row 5: Action buttons */
.card-actions-row {
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}
.card-actions-row button {
  height:40px;
  padding:0 16px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.07);
  font-weight:600;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#fff;
  transition:all .16s;
  user-select:none;
}
#follow {
  flex:1.3;
}
#fit {
  flex:1;
}
.card-actions-row button:hover {
  background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.24);
}
.card-actions-row button:active { transform:scale(0.96) }

#follow[aria-pressed="true"] {
  background:#2563eb;
  border-color:#60a5fa;
  color:#fff;
  box-shadow:0 0 16px rgba(37,99,235,.55);
}
#followDot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
  display:inline-block;
}
#follow[aria-pressed="true"] #followDot {
  animation:pulseDot 1s infinite;
}
@keyframes pulseDot {
  0% { transform:scale(0.8); opacity:0.6; }
  50% { transform:scale(1.3); opacity:1; }
  100% { transform:scale(0.8); opacity:0.6; }
}

/* ─── LIQUID GLASS BOTTOM NAV BAR ─── */
#nav {
  height:56px;
  border-radius:20px;
  padding:5px;
  display:flex;
  gap:6px;
  align-items:stretch;
}
#nav button {
  flex:1;
  border:1px solid transparent;
  border-radius:15px;
  background:transparent;
  font-weight:600;
  font-size:14px;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  user-select:none;
  -webkit-user-select:none;
}
#nav button:hover {
  color:#fff;
  background:rgba(255,255,255,.06);
}
#nav button:active { transform:scale(0.97) }
#nav button[aria-pressed="true"], #nav button.active {
  color:#ffffff;
  background:linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.08) 100%);
  border:1px solid rgba(255, 255, 255, 0.24);
  box-shadow: 
    inset 0 1px 1px rgba(255, 255, 255, 0.35),
    0 4px 14px rgba(0, 0, 0, 0.4);
  text-shadow:0 1px 2px rgba(0,0,0,.4);
}
.nav-count {
  font-size:11px;
  font-weight:700;
  padding:2px 7px;
  border-radius:999px;
  background:rgba(255, 255, 255, 0.12);
  color:#fff;
  margin-left:2px;
  font-variant-numeric:tabular-nums;
}

/* ─── MAP CONTROLS & SAFE-AREA POSITIONS ─── */
.maplibregl-ctrl-top-right {
  top:max(10px, env(safe-area-inset-top))!important;
  right:max(10px, env(safe-area-inset-right))!important;
}
.maplibregl-ctrl-group {
  background:rgba(18,22,32,.92)!important;
  border:1px solid rgba(255,255,255,.14)!important;
  border-radius:14px!important;
  overflow:hidden;
  box-shadow:0 8px 26px rgba(0,0,0,.5)!important;
}
.maplibregl-ctrl-group button { filter:invert(1); opacity:.88 }
.maplibregl-ctrl-group button + button { border-top:1px solid rgba(255,255,255,.12)!important }
.maplibregl-ctrl-attrib {
  background:rgba(12,14,20,.82)!important;
  color:rgba(255,255,255,.62)!important;
  font-size:11px;
  border-radius:8px!important;
  margin:0 6px 6px 0!important;
}
.maplibregl-ctrl-attrib a { color:#fff!important }
.maplibregl-ctrl-bottom-right {
  bottom:calc(72px + env(safe-area-inset-bottom))!important;
  right:max(8px, env(safe-area-inset-right))!important;
}

/* ─── VEHICLE MARKERS ─── */
.v { pointer-events:auto; cursor:pointer; user-select:none; -webkit-user-select:none }
.v > span {
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 6px;
  border-radius:7px;
  font-weight:700;
  font-size:13px;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
  color:#fff;
  line-height:1;
  box-shadow:0 0 0 1px rgba(0,0,0,.75), 0 4px 12px rgba(0,0,0,.45);
  transform:scale(var(--ms));
  transform-origin:center;

const LAT0 = 44.43, LNG0 = 26.10, MX = 111320 * Math.cos(LAT0 * Math.PI / 180), MY = 110574, S3 = Math.sqrt(3);
function hexOf(lng, lat) {
  const x = (lng - LNG0) * MX, y = (lat - LAT0) * MY;
  const cx = (S3 / 3 * x - y / 3) / HEX_R, cz = (2 / 3 * y) / HEX_R, cy = -cx - cz;
  let rx = Math.round(cx), ry = Math.round(cy), rz = Math.round(cz);
  const dx = Math.abs(rx - cx), dy = Math.abs(ry - cy), dz = Math.abs(rz - cz);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return [rx, rz];
}
function hexPoly(q, r) {
  const cx = HEX_R * S3 * (q + r / 2), cy = HEX_R * 1.5 * r, pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    pts.push([LNG0 + (cx + HEX_R * Math.cos(a)) / MX, LAT0 + (cy + HEX_R * Math.sin(a)) / MY]);
  }
  pts.push(pts[0]);
  return [pts];
}

    .addTo(map);

  try {
    const res = await fetch(`/api/eta?stopId=${encodeURIComponent(stopId)}`);
    if (!res.ok) throw new Error("Eroare la preluarea sosirilor");
    const data = await res.json();

    const loadEl = etaSec.querySelector(".pop-loading");
    if (loadEl) loadEl.remove();

    if (!data.arrivals || !data.arrivals.length) {
      const empty = document.createElement("div");
      empty.className = "pop-arr-empty";
      empty.textContent = "Niciun vehicul în tranzit spre această stație momentan.";
      etaSec.appendChild(empty);
      return;
    }

    const list = document.createElement("div");
    list.className = "pop-arrivals-list";

    // Sort by ETA ascending (closest arrival first)
    const sorted = data.arrivals.slice(0, 8).sort((a, b) => a.etaMinutes - b.etaMinutes);

    for (const arr of sorted) {
      const item = document.createElement("div");
      item.className = "pop-arrival-item";
      const isAtStop = arr.etaText === "În stație" || (arr.isDirectStop && arr.distMeters < 60);
      const isUrgent = arr.etaMinutes <= 1 && !isAtStop;
      const badgeColor = colorOf(arr.type || typeOfLine(arr.line));
      const textColor = arr.type === "metro" ? "#1a1404" : "#fff";
      const distStr = arr.distMeters < 1000 ? `${arr.distMeters} m` : `${(arr.distMeters / 1000).toFixed(1)} km`;

      // Proximity progress: max 12km = 0%, 0m = 100%
      const progressPct = Math.max(0, Math.min(100, Math.round((1 - arr.distMeters / 8000) * 100)));

      // Short ETA text for the big display
      let shortEta;
      if (isAtStop) {
        shortEta = "În stație";
      } else if (arr.etaMinutes <= 1) {
        shortEta = "~1 min";
      } else {
        shortEta = arr.etaMinutes + " min";
      }

      item.innerHTML = `
        <div class="pop-arr-progress" style="width:${progressPct}%;background:${badgeColor}"></div>
        <div class="pop-arr-left">
          <span class="pop-line-pill" style="background:${badgeColor};color:${textColor}">${arr.line}</span>
          <span class="pop-arr-dest" title="${arr.headsign ? 'spre ' + arr.headsign : ''}">${arr.headsign ? 'spre ' + arr.headsign : 'în curs'}</span>
        </div>
        <div class="pop-arr-right">
          <span class="pop-arr-eta ${isAtStop ? 'atStop' : (isUrgent ? 'urgent' : '')}">${shortEta}</span>
          <span class="pop-arr-dist">${distStr}</span>
        </div>
      `;

      item.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (arr.vehicleId) {
          chooseVehicle(arr.vehicleId);
        }
      });
      list.appendChild(item);
    }
    etaSec.appendChild(list);
  } catch (err) {
    const loadEl = etaSec.querySelector(".pop-loading");
    if (loadEl) {
      loadEl.innerHTML = `<span style="color:#ff6b81;font-size:12px">Nu s-au putut încărca sosirile.</span>`;
    }
  }
}

function updateHex() {

  for (const s of states.values()) {
    if (!isVisible(s)) continue;
    const [q, r] = hexOf(s.cur[0], s.cur[1]), k = q + "," + r;
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  const features = [...counts].map(([k, n]) => {

}

function ingest(data) {
  const now = performance.now(), seen = new Set();
  for (const v of data.vehicles) {
    seen.add(v.id);
    let s = states.get(v.id);
    if (!s) {
      const el = document.createElement("div");
      el.className = "v";
      el.innerHTML = '<i class="tick" aria-hidden="true"></i><span></span>';
      el.addEventListener("click", (ev) => {
        ev.stopPropagation();
        markerJustClicked = true;
        setTimeout(() => { markerJustClicked = false; }, 350);
        chooseVehicle(v.id);
      });
      const marker = new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([v.lng, v.lat]).addTo(map);
      s = { id: v.id, marker, el, cur: [v.lng, v.lat], from: [v.lng, v.lat], to: [v.lng, v.lat], t0: now, line: "", type: "" };
      states.set(v.id, s);
    } else if (s.to[0] !== v.lng || s.to[1] !== v.lat) {
      const moved = Math.hypot(v.lng - s.to[0], v.lat - s.to[1]);
      if (v.bearing == null && moved > 0.00015) {
        v.bearing = (Math.atan2(v.lng - s.to[0], v.lat - s.to[1]) * 180 / Math.PI + 360) % 360;
      }
      s.from = s.cur.slice();
      s.to = [v.lng, v.lat];
      s.t0 = now;
    }
    s.miss = 0;
    Object.assign(s, {
      line: v.line, type: v.type || "bus", long: v.long || "", headsign: v.headsign || "",
      label: v.label || "", plate: v.plate || "", stop: v.stop || "", status: v.status || "",
      speedKmh: v.speedKmh, bearing: v.bearing, ts: v.ts,
      stopId: v.stopId || "", nextStopEta: v.nextStopEta || null
    });
    paintMarker(s);
  }
  for (const [id, s] of states) {
    if (seen.has(id)) continue;
    s.miss = (s.miss || 0) + 1;
    if (s.miss >= MISS_LIMIT) {
      s.marker.remove();
      states.delete(id);
      if (selectedId === id) {
        selectedId = null;
        stopFollow();
      }
    }
  }
  refreshCounts();
  applyFilters();
  $("navCount").textContent = String(data.count || states.size);
  const st = $("statusText");
  if (st) {
    st.textContent = `Live · ${states.size} vehicule · ${new Date().toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
  }
}

// ─── RAF LOOP & CAMERA TRACKING ───
function frame(now) {
  for (const s of states.values()) {
    const p = Math.min(1, (now - s.t0) / TWEEN_MS);
    if (p < 1 || s.cur[0] !== s.to[0] || s.cur[1] !== s.to[1]) {
      s.cur = [
        s.from[0] + (s.to[0] - s.from[0]) * p,
        s.from[1] + (s.to[1] - s.from[1]) * p
      ];
      s.marker.setLngLat(s.cur);
    }
  }

  // Camera moves synchronously with the vehicle
  if (follow && selectedId) {
    const s = states.get(selectedId);
    if (s && s.cur) {
      map.jumpTo({ center: s.cur });
    } else {
      stopFollow();
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function lineVehicles(name) {
  return [...states.values()].filter((s) => s.line === name);
}
function termini(long) {
  if (!long) return "";
  const parts = long.split(/\s+-\s+/);
  return parts.length >= 2 ? parts.join("  ·  ") : long;
}
function ageText(ts) {
  if (!ts) return "";
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 5) return "semnal acum";
  if (s < 90) return `semnal acum ${s}s`;
  return `semnal acum ${Math.round(s / 60)} min`;
}
function vehicleLine(s) {
  if (!s) return "";
  const bits = [];
  if (s.label && s.label !== s.line) bits.push("nr. " + s.label);
  if (s.plate) bits.push(s.plate);
  if (s.speedKmh != null) bits.push(s.speedKmh + " km/h");
  
  let where = "";
  if (s.nextStopEta && s.nextStopEta.stopName) {
    where = `Următoarea stație: ${s.nextStopEta.stopName} · ${s.nextStopEta.etaText}`;
  } else if (s.stop) {
    where = STATUS_RO[s.status] ? `${STATUS_RO[s.status]} ${s.stop}` : s.stop;
  }
  const dest = s.headsign ? `spre ${s.headsign}` : "";
  return [bits.join(" · "), dest, where, ageText(s.ts)].filter(Boolean).join(" · ");
}

function terminiFancy(long) {
  if (!long) return "";
  const parts = long.split(/\s+-\s+/);
  if (parts.length >= 2) return parts[0].trim() + "  ➔  " + parts[parts.length - 1].trim();
  return long;
}

function applyFilters() {
  let count = 0, focused = null;

  } else {

        "case",
        ["in", linePattern, ["get", "lineList"]],
        colorOf(typeOfLine(selectedLine)),
        "rgba(140, 150, 165, 0.45)"
      ]);
      map.setPaintProperty("stops-core", "circle-radius", [
        "interpolate", ["linear"], ["zoom"],
        13, ["case", ["in", linePattern, ["get", "lineList"]], 3.2, 1.6],
        15, ["case", ["in", linePattern, ["get", "lineList"]], 5.2, 2.5],
        17, ["case", ["in", linePattern, ["get", "lineList"]], 7.5, 3.8]
      ]);
    } else {

      map.setPaintProperty("stops-core", "circle-radius", [

function typeOfLine(name) {
  if (!allLines) return "bus";
  for (const k of TYPE_ORDER) if ((allLines[k] || []).some((l) => l.name === name)) return k;
  return "bus";
}
function longOf(name) {
  if (!allLines) return "";
  for (const k of TYPE_ORDER) {
    const hit = (allLines[k] || []).find((l) => l.name === name);
    if (hit) return hit.long || "";
  }
  return "";
}

async function showRoute(name, fit) {
  let route = routeCache.get(name);
  if (!route) {
    try {
      const res = await fetch("/api/route/" + encodeURIComponent(name));
      route = res.ok ? await res.json() : { paths: [] };
    } catch { route = { paths: [] }; }
    routeCache.set(name, route);
  }
  if (selectedLine !== name || !mapReady) return;
  const color = colorOf(route.type || typeOfLine(name));
  const features = (route.paths || []).filter((p) => p.coordinates?.length > 1).map((p) => ({
    type: "Feature", properties: { color }, geometry: { type: "LineString", coordinates: p.coordinates }
  }));
  map.getSource("route").setData({ type: "FeatureCollection", features });
  if (!fit) return;
  const b = new maplibregl.LngLatBounds();
  let n = 0;
  for (const f of features) for (const c of f.geometry.coordinates) { b.extend(c); n++; }
  for (const s of lineVehicles(name)) { b.extend(s.cur); n++; }
  if (n) map.fitBounds(b, { padding: { top: 120, bottom: 200, left: 30, right: 30 }, maxZoom: 15.2, duration: 800 });
}

function clearRoute() {
  if (mapReady) map.getSource("route").setData(emptyFc());
}

function chooseLine(name, fit = true) {
  if (!name) return clearSelection();
  selectedLine = name;
  selectedId = null;
  stopFollow();
  applyFilters();
  showRoute(name, fit);
}

function chooseVehicle(id) {
  if (selectedId === id) {
    const s = states.get(id);
    const lastPos = s?.cur || map.getCenter();
    clearSelection();
    zoomOutLocalArea(lastPos);
    return;
  }
  const s = states.get(id);
  if (!s) return;
  const sameLine = selectedLine === s.line;
  selectedLine = s.line;
  selectedId = id;
  stopFollow();
  applyFilters();
  if (!sameLine) showRoute(s.line, false);
  const zoom = map.getZoom();
  map.easeTo({ center: s.cur, zoom: zoom < 14.5 ? 15.2 : zoom, duration: 600 });
}

function clearSelection() {
  selectedLine = null;
  selectedId = null;
  stopFollow();
  if (currentStopPopup) {
    currentStopPopup.remove();
    currentStopPopup = null;
  }
  if (query) {
    query = "";
    $("q").value = "";
    $("searchClear").style.display = "none";
  }
  clearRoute();
  applyFilters();
}

// ─── FOLLOW VEHICLE CONTROLS ───
function toggleFollow() {
  if (!selectedId) return;
  follow = !follow;
  updateFollowUI();
  if (follow) {
    const s = states.get(selectedId);
    if (s) {
      const z = map.getZoom();
      if (z < 15) {
        map.easeTo({ center: s.cur, zoom: 15.6, duration: 550 });
      } else {
        map.jumpTo({ center: s.cur });
      }
    }
  }
}
function stopFollow() {

function catalog() {
  const out = [];
  if (allLines) {
    for (const k of TYPE_ORDER) for (const l of allLines[k] || []) out.push({ name: l.name, long: l.long || "", type: k });
  } else {
    const seen = new Set();
    for (const s of states.values()) if (!seen.has(s.line)) { seen.add(s.line); out.push({ name: s.line, long: s.long || "", type: s.type }); }
  }
  return out;
}
function rankName(name, q) {
  const n = name.toLowerCase();
  if (n === q) return 0;
  if (n.startsWith(q)) return 1;
  if (n.includes(q)) return 2;
  return 9;
}
function matches(q) {
  if (!q) return [];
  return catalog()
    .map((l) => ({ ...l, rank: rankName(l.name, q) }))
    .filter((l) => l.rank < 9)
    .sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name, undefined, { numeric: true }))
    .slice(0, 8);
}
function renderSuggest() {
  const box = $("suggest");
  suggestItems = matches(query);
  suggestIdx = suggestItems.length ? 0 : -1;
  box.innerHTML = "";
  if (!query || !suggestItems.length) { box.style.display = "none"; $("q").setAttribute("aria-expanded", "false"); return; }
  suggestItems.forEach((l, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "option");
    b.setAttribute("aria-selected", i === suggestIdx);
    const badge = document.createElement("b");
    badge.textContent = l.name;
    badge.style.background = colorOf(l.type);
    badge.style.color = l.type === "metro" ? "#1a1404" : "#fff";
    const sub = document.createElement("span");
    sub.textContent = termini(l.long) || TYPES[l.type].label;
    b.append(badge, sub);
    b.addEventListener("mousedown", (ev) => { ev.preventDefault(); pickSuggest(i); });
    box.appendChild(b);
  });
  box.style.display = "flex";
  $("q").setAttribute("aria-expanded", "true");
}
function pickSuggest(i) {
  const l = suggestItems[i];
  if (!l) return;
  $("q").value = "";
  $("searchClear").style.display = "none";
  query = "";
  $("suggest").style.display = "none";
  $("q").setAttribute("aria-expanded", "false");
  closeSheet();
  chooseLine(l.name, true);
}
function refreshCounts() {
  for (const k of TYPE_ORDER) {
    const el = document.querySelector(`[data-type="${k}"] em`);
    if (!el) continue;
    let n = 0;
    for (const s of states.values()) if (s.type === k) n++;
    el.textContent = String(n);
  }
}

// ─── LIVE DATA POLLING ───
async function poll() {
  try {
    const d = await (await fetch("/api/vehicles")).json();
    if (d.error && !d.vehicles?.length) throw new Error(d.error);
    ingest(d);
  } catch (e) {
    const st = $("statusText");
    if (st) st.textContent = "Reconectare live: " + e.message;
  }
}
poll();
setInterval(poll, POLL_MS);
loadLines();

// ─── CHIPS (Vehicle type filters) ───
for (const k of ["tram", "trolleybus", "bus", "night"]) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.dataset.type = k;
  b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<i style="background:${TYPES[k].color}"></i>${TYPES[k].label} <em>0</em>`;
  b.addEventListener("click", () => {
    typeOn[k] = !typeOn[k];
    b.setAttribute("aria-pressed", String(typeOn[k]));
    applyFilters();
  });
  $("chips").appendChild(b);
}

// ─── SEARCH INPUT EVENTS ───
$("q").addEventListener("input", (e) => {
  query = e.target.value.trim().toLowerCase();
  $("searchClear").style.display = query ? "flex" : "none";
  applyFilters();
  renderSuggest();
});
$("searchClear").addEventListener("click", () => {
  $("q").value = "";
  $("searchClear").style.display = "none";
  query = "";
  $("suggest").style.display = "none";
  applyFilters();
  $("q").focus();
});
$("q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!suggestItems.length) return;
    e.preventDefault();
    suggestIdx = (suggestIdx + (e.key === "ArrowDown" ? 1 : -1) + suggestItems.length) % suggestItems.length;
    [...$("suggest").children].forEach((el, i) => el.setAttribute("aria-selected", i === suggestIdx));
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (suggestIdx >= 0) pickSuggest(suggestIdx);
  } else if (e.key === "Escape") {
    if ($("suggest").style.display === "flex") { $("suggest").style.display = "none"; return; }
    clearSelection();
    $("q").blur();
  }
});
$("q").addEventListener("focus", renderSuggest);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape") {
    $("suggest").style.display = "none";
    if (selectedLine || selectedId) {
      const s = selectedId ? states.get(selectedId) : null;
      const lastPos = s?.cur || map.getCenter();
      clearSelection();
      zoomOutLocalArea(lastPos);
    }
  }
});

// ─── CARD ACTIONS ───
$("clear").addEventListener("click", () => {
  const s = selectedId ? states.get(selectedId) : null;
  const lastPos = s?.cur || map.getCenter();
  clearSelection();
  zoomOutLocalArea(lastPos);
});
$("fit").addEventListener("click", () => { if (selectedLine) showRoute(selectedLine, true); });
$("follow").addEventListener("click", toggleFollow);

// ─── 3D PERSPECTIVE TOGGLE ───
$("b3d").addEventListener("click", () => {
  pitch3d = !pitch3d;
  $("b3d").setAttribute("aria-pressed", String(pitch3d));
  $("label3d").textContent = pitch3d ? "3D" : "2D";
  map.easeTo({ pitch: pitch3d ? 48 : 0, duration: 650 });
});

// ─── MAP GESTURES ───
map.on("dragstart", () => {
  if (follow) {
    stopFollow();
  }
});
map.on("click", () => {
  if (markerJustClicked) return;
  if ($("suggest").style.display === "flex") $("suggest").style.display = "none";
  $("q").blur();
  if ($("sheet").style.display === "flex") closeSheet();
  if (currentStopPopup) {
    currentStopPopup.remove();
    currentStopPopup = null;
  }

  // Tap anywhere on the map: deselect, zoom out, remain in the tracked vehicle's zone
  if (selectedLine || selectedId) {
    const s = selectedId ? states.get(selectedId) : null;
    const lastPos = s?.cur || map.getCenter();
    clearSelection();
    zoomOutLocalArea(lastPos);
  }
});

// ─── SHEET (LINES & VEHICLES DIALOG) ───
async function loadLines() {
  try { allLines = (await (await fetch("/api/lines")).json()).lines || {}; }
  catch { allLines = {}; }
}
async function openSheet() {
  if (!allLines) await loadLines();
  $("card").style.display = "none";
  renderSheet();
  $("sheet").style.display = "flex";
  $("bLines").setAttribute("aria-pressed", "true");
  $("bMap").setAttribute("aria-pressed", "false");
}
function closeSheet() {
  $("sheet").style.display = "none";
  $("bLines").setAttribute("aria-pressed", "false");
  $("bMap").setAttribute("aria-pressed", "true");
  if (selectedLine) {
    applyFilters();
  }
}
function renderSheet() {
  const live = new Map();
  for (const s of states.values()) live.set(s.line, (live.get(s.line) || 0) + 1);
  $("tabs").innerHTML = "";
  const present = TYPE_ORDER.filter((k) => (allLines?.[k] || []).length);
  if (!present.includes(tab)) tab = present[0] || "tram";
  for (const k of present) {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(k === tab));
    b.textContent = TYPES[k].label;
    if (k === tab) b.style.background = TYPES[k].color;
    if (k === tab && k === "metro") b.style.color = "#1a1404";
    b.addEventListener("click", () => { tab = k; renderSheet(); });
    $("tabs").appendChild(b);
  }
  $("list").innerHTML = "";
  const rows = (allLines?.[tab] || []).filter((l) => !query || l.name.toLowerCase().includes(query) || (l.long || "").toLowerCase().includes(query));
  for (const l of rows) {
    const n = live.get(l.name) || 0;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ln" + (n ? "" : " off") + (l.name === selectedLine ? " active" : "");
    const badge = document.createElement("b");
    badge.textContent = l.name;
    badge.style.background = TYPES[tab].color;
    badge.style.color = tab === "metro" ? "#1a1404" : "#fff";
    const sub = document.createElement("span");
    sub.textContent = termini(l.long) || "Linie";
    const count = document.createElement("em");
    count.textContent = n ? String(n) : "–";
    b.append(badge, sub, count);
    b.addEventListener("click", () => {
      closeSheet();
      const vList = lineVehicles(l.name);
      if (vList.length === 1) {
        chooseVehicle(vList[0].id);
      } else {
        chooseLine(l.name, true);
      }
    });
    $("list").appendChild(b);
  }
  if (!rows.length) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:16px 8px;color:var(--muted);font-size:13px;text-align:center";
    empty.textContent = "Nicio linie găsită pentru căutarea curentă.";
    $("list").appendChild(empty);
  }
  $("sheetNote").textContent = tab === "metro"
    ? "Metroul nu publică poziții GPS live în feed-ul TPBI."
    : "Atinge o linie pentru a o afișa pe hartă. Numărul indică vehiculele active.";
}

// ─── BOTTOM NAV BAR EVENTS ───
$("sheetClose").addEventListener("click", closeSheet);
$("bLines").addEventListener("click", () => {
  if ($("sheet").style.display === "flex") {
    closeSheet();
  } else {
    openSheet();
  }
});
$("bMap").addEventListener("click", () => {
  closeSheet();
  if (follow) stopFollow();
  if (selectedLine || selectedId) {
    clearSelection();
  }
  resetToCityOverview();
  $("bMap").setAttribute("aria-pressed", "true");
  $("bLines").setAttribute("aria-pressed", "false");
});
</script>
</body>
</html>
